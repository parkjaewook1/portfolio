<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">관리자 인가와 최신 DB 권한</title><desc id="desc">토큰 권한과 현재 DB 권한을 함께 확인하는 관리자 API 처리</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3b124b"/></marker></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect width="1200" height="800" fill="#faf8f4"/><text x="40" y="43" font-size="16" fill="#756c67" font-weight="500"><tspan x="40" dy="0">PETMILY / BACKEND ENGINEERING</tspan></text><text x="40" y="97" font-size="34" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">02 · 관리자 인가와 최신 DB 권한</tspan></text><text x="40" y="138" font-size="21" fill="#756c67" font-weight="400"><tspan x="40" dy="0">과거 관리자 토큰이 남아 있어도, DB 강등 후 관리자 요청을 차단</tspan></text><rect x="40" y="180" width="500" height="144" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="60" y="216" font-size="24" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">1차 · 보안 필터 체인</tspan></text><text x="60" y="258" font-size="21" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">JWT의 ROLE_ADMIN 확인</tspan><tspan x="60" dy="32.550000000000004">AdminMemberSecurityConfiguration</tspan></text><text x="569" y="259" font-size="22" fill="#3b124b" font-weight="600"><tspan x="569" dy="0">AND</tspan></text><rect x="650" y="180" width="510" height="144" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="670" y="216" font-size="24" fill="#3b124b" font-weight="600"><tspan x="670" dy="0">2차 · 서비스 권한 확인</tspan></text><text x="670" y="258" font-size="21" fill="#302b2a" font-weight="400"><tspan x="670" dy="0">MemberAccessService → 현재 계정 조회</tspan><tspan x="670" dy="32.550000000000004">현재 DB의 Role도 ADMIN이어야 허용</tspan></text><path d="M290 324 L290 360" stroke="#3b124b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M900 324 L900 360" stroke="#3b124b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="370" width="1120" height="190" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="62" y="405" font-size="20" fill="#756c67" font-weight="500"><tspan x="62" dy="0">토큰 권한</tspan></text><text x="390" y="405" font-size="20" fill="#756c67" font-weight="500"><tspan x="390" dy="0">현재 DB</tspan></text><text x="780" y="405" font-size="20" fill="#756c67" font-weight="500"><tspan x="780" dy="0">관리자 요청</tspan></text><text x="62" y="447" font-size="23" fill="#3b124b" font-weight="500"><tspan x="62" dy="0">ADMIN</tspan></text><text x="390" y="447" font-size="23" fill="#302b2a" font-weight="400"><tspan x="390" dy="0">ADMIN</tspan></text><text x="780" y="447" font-size="23" fill="#302b2a" font-weight="400"><tspan x="780" dy="0">허용</tspan></text><text x="62" y="490" font-size="23" fill="#3b124b" font-weight="500"><tspan x="62" dy="0">ADMIN</tspan></text><text x="390" y="490" font-size="23" fill="#302b2a" font-weight="400"><tspan x="390" dy="0">USER</tspan></text><text x="780" y="490" font-size="23" fill="#302b2a" font-weight="400"><tspan x="780" dy="0">403 · 강등 반영</tspan></text><text x="62" y="533" font-size="23" fill="#3b124b" font-weight="500"><tspan x="62" dy="0">USER</tspan></text><text x="390" y="533" font-size="23" fill="#302b2a" font-weight="400"><tspan x="390" dy="0">ADMIN</tspan></text><text x="780" y="533" font-size="23" fill="#302b2a" font-weight="400"><tspan x="780" dy="0">403 · 구 토큰 승격 금지</tspan></text><text x="40" y="595" font-size="19" fill="#3b124b" font-weight="400"><tspan x="40" dy="0">검증 기록: 구 관리자 토큰 강등 후 거부 · 삭제 계정 인증 실패 · 서비스 직접 호출도 검사</tspan></text><rect x="40" y="620" width="1120" height="112" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="60" y="653" font-size="18" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">팀 기반</tspan></text><text x="60" y="688" font-size="18" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">Spring Security · JWT의 권한 정보</tspan></text><text x="590" y="653" font-size="18" fill="#3b124b" font-weight="600"><tspan x="590" dy="0">이후 개인 개선</tspan></text><text x="590" y="688" font-size="18" fill="#302b2a" font-weight="400"><tspan x="590" dy="0">우선 관리자 체인 · 서비스의 현재 DB Role 확인</tspan></text><text x="40" y="770" font-size="17" fill="#756c67" font-weight="400"><tspan x="40" dy="0">범위: 관리자/회원 접근 검증. 모든 API의 토큰 폐기 목록이나 진행 중인 요청 취소를 뜻하지 않음</tspan></text></g></svg>