<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1120" role="img" aria-labelledby="title desc"><title id="title">회원 DTO와 응답 경계 모바일</title><desc id="desc">필요한 필드만 조회하고 반환</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3b124b"/></marker></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect width="400" height="1120" fill="#faf8f4"/><text x="24" y="34" font-size="12" fill="#756c67" font-weight="500"><tspan x="24" dy="0">PETMILY / BACKEND</tspan></text><text x="24" y="76" font-size="25" fill="#3b124b" font-weight="600"><tspan x="24" dy="0">회원 DTO와 응답 경계</tspan></text><text x="24" y="112" font-size="17" fill="#756c67" font-weight="400"><tspan x="24" dy="0">필요한 필드만 조회하고 반환</tspan></text><rect x="24" y="148" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="180" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">프로필 조회 흐름</tspan></text><text x="40" y="215" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">React → Controller → Service</tspan><tspan x="40" dy="27.900000000000002">현재 계정·권한으로 응답 등급 선택</tspan><tspan x="40" dy="27.900000000000002">MyBatis의 명시 SELECT → DTO</tspan></text><rect x="24" y="332" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="364" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">타인 · 공개 DTO</tspan></text><text x="40" y="399" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">id / nickname / imageUrl</tspan><tspan x="40" dy="27.900000000000002">공개 SELECT는 id, nickname</tspan><tspan x="40" dy="27.900000000000002">imageUrl은 프로필에서 보완</tspan></text><rect x="24" y="516" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="548" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">본인 · 현재 관리자 상세</tspan></text><text x="40" y="583" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">편집에 필요한 상세 필드 허용</tspan><tspan x="40" dy="27.900000000000002">비밀번호·Refresh 값은 응답 제외</tspan><tspan x="40" dy="27.900000000000002">도메인 WRITE_ONLY로 추가 방어</tspan></text><rect x="24" y="700" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="732" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">검증 기록</tspan></text><text x="40" y="767" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">타인 응답은 공개 3필드</tspan><tspan x="40" dy="27.900000000000002">인증용 SELECT 미호출</tspan><tspan x="40" dy="27.900000000000002">직렬화·toString 노출 방어</tspan></text><rect x="24" y="902" width="352" height="94" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="40" y="935" font-size="17" fill="#3b124b" font-weight="500"><tspan x="40" dy="0">팀: 회원 API·MyBatis 기반</tspan><tspan x="40" dy="26.35">개인: DTO·프로젝션·직렬화 방어</tspan></text><text x="24" y="1030" font-size="15" fill="#756c67" font-weight="400"><tspan x="24" dy="0">근거: MemberService / MemberMapper</tspan><tspan x="24" dy="23.25">MemberSecurityUnitTest</tspan><tspan x="24" dy="23.25">공개 DTO ≠ 익명 URL 개방</tspan></text></g></svg>