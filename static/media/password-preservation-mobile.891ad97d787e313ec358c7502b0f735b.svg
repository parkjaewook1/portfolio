<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1120" role="img" aria-labelledby="title desc"><title id="title">기존 비밀번호 해시 보존 모바일</title><desc id="desc">선택 입력을 동적 UPDATE와 연결</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3b124b"/></marker></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect width="400" height="1120" fill="#faf8f4"/><text x="24" y="34" font-size="12" fill="#756c67" font-weight="500"><tspan x="24" dy="0">PETMILY / BACKEND</tspan></text><text x="24" y="76" font-size="25" fill="#3b124b" font-weight="600"><tspan x="24" dy="0">기존 비밀번호 해시 보존</tspan></text><text x="24" y="112" font-size="17" fill="#756c67" font-weight="400"><tspan x="24" dy="0">선택 입력을 동적 UPDATE와 연결</tspan></text><rect x="24" y="148" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="180" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">생략 / null / 빈 문자열</tspan></text><text x="40" y="215" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">변경 없음으로 정규화</tspan><tspan x="40" dy="27.900000000000002">password SET에서 제외</tspan><tspan x="40" dy="27.900000000000002">기존 DB 해시를 그대로 보존</tspan></text><rect x="24" y="332" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="364" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">명시적인 새 값</tspan></text><text x="40" y="399" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">형식 검사 → BCrypt encode 1회</tspan><tspan x="40" dy="27.900000000000002">유효한 변경만 UPDATE</tspan><tspan x="40" dy="27.900000000000002">공백·잘못된 형식은 400</tspan></text><rect x="24" y="516" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="548" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">DB 반영 흐름</tspan></text><text x="40" y="583" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">React 폼 → Controller → Service</tspan><tspan x="40" dy="27.900000000000002">MyBatis 조건부 SET → DB</tspan><tspan x="40" dy="27.900000000000002">기존 해시를 읽어 재해싱하지 않음</tspan></text><rect x="24" y="700" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="732" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">검증 기록</tspan></text><text x="40" y="767" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">미입력 encoder 미호출</tspan><tspan x="40" dy="27.900000000000002">명시 변경 encode 1회</tspan><tspan x="40" dy="27.900000000000002">잘못된 입력 거부·기존 해시 보존</tspan></text><rect x="24" y="902" width="352" height="94" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="40" y="935" font-size="17" fill="#3b124b" font-weight="500"><tspan x="40" dy="0">팀: 회원 수정·BCrypt·MyBatis</tspan><tspan x="40" dy="26.35">개인: 입력 검증·동적 SET 보완</tspan></text><text x="24" y="1030" font-size="15" fill="#756c67" font-weight="400"><tspan x="24" dy="0">근거: MemberService / MemberMapper</tspan><tspan x="24" dy="23.25">MemberSecurityUnitTest</tspan><tspan x="24" dy="23.25">현재 비밀번호 재입력을 추가한 것은 아님</tspan></text></g></svg>