<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">회원 DTO와 민감정보 응답 경계</title><desc id="desc">타인 프로필과 본인 또는 현재 관리자 상세를 분리한 응답 설계</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3b124b"/></marker></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect width="1200" height="800" fill="#faf8f4"/><text x="40" y="43" font-size="16" fill="#756c67" font-weight="500"><tspan x="40" dy="0">PETMILY / BACKEND ENGINEERING</tspan></text><text x="40" y="97" font-size="34" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">03 · DTO와 SQL 프로젝션으로 응답 경계 설정</tspan></text><text x="40" y="138" font-size="21" fill="#756c67" font-weight="400"><tspan x="40" dy="0">필요한 필드만 조회하고 반환 · 화면에서 감추는 방식에 의존하지 않음</tspan></text><rect x="40" y="178" width="1120" height="105" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="60" y="214" font-size="24" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">React → MemberController → MemberService → MemberMapper → DB</tspan></text><text x="60" y="256" font-size="21" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">호출자의 현재 계정/권한에 따라 공개 또는 상세 프로젝션 선택</tspan></text><path d="M320 283 L320 322" stroke="#3b124b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M875 283 L875 322" stroke="#3b124b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="335" width="540" height="188" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="60" y="371" font-size="24" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">타인 · PublicMemberProfile</tspan></text><text x="60" y="413" font-size="21" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">id / nickname / imageUrl</tspan><tspan x="60" dy="32.550000000000004">공개 SELECT는 id, nickname만 조회</tspan><tspan x="60" dy="32.550000000000004">imageUrl은 별도 프로필 조회로 보완</tspan></text><rect x="620" y="335" width="540" height="188" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="640" y="371" font-size="24" fill="#3b124b" font-weight="600"><tspan x="640" dy="0">본인 · 현재 관리자 상세</tspan></text><text x="640" y="413" font-size="21" fill="#302b2a" font-weight="400"><tspan x="640" dy="0">PrivateMemberProfile</tspan><tspan x="640" dy="32.550000000000004">편집에 필요한 상세 필드는 허용</tspan><tspan x="640" dy="32.550000000000004">비밀번호·Refresh 값은 응답에서 제외</tspan></text><text x="40" y="564" font-size="20" fill="#3b124b" font-weight="400"><tspan x="40" dy="0">개선 전: Member 전체 직렬화로 불필요한 필드 노출 → 개선 후: DTO 허용 필드만 응답</tspan></text><text x="40" y="598" font-size="19" fill="#3b124b" font-weight="400"><tspan x="40" dy="0">검증 기록: 공개 3필드 · 인증용 SELECT 미호출 · WRITE_ONLY / toString 방어</tspan></text><rect x="40" y="620" width="1120" height="112" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="60" y="653" font-size="18" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">팀 기반</tspan></text><text x="60" y="688" font-size="18" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">회원 조회 API · MyBatis · 프로필 사용처</tspan></text><text x="590" y="653" font-size="18" fill="#3b124b" font-weight="600"><tspan x="590" dy="0">이후 개인 개선</tspan></text><text x="590" y="688" font-size="18" fill="#302b2a" font-weight="400"><tspan x="590" dy="0">공개/상세 DTO · 명시 SELECT · 직렬화 방어</tspan></text><text x="40" y="770" font-size="17" fill="#756c67" font-weight="400"><tspan x="40" dy="0">공개는 필드 등급이다. 인증 필요 URL을 익명에게 새로 개방했다는 의미가 아니다.</tspan></text></g></svg>