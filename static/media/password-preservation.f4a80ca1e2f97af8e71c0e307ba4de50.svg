<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">선택적 비밀번호 수정과 기존 해시 보존</title><desc id="desc">비밀번호 변경 요청의 유무를 분리하고 MyBatis 동적 UPDATE로 기존 해시 보존</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3b124b"/></marker></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect width="1200" height="800" fill="#faf8f4"/><text x="40" y="43" font-size="16" fill="#756c67" font-weight="500"><tspan x="40" dy="0">PETMILY / BACKEND ENGINEERING</tspan></text><text x="40" y="97" font-size="34" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">04 · 비밀번호 미변경과 변경을 명확히 분리</tspan></text><text x="40" y="138" font-size="21" fill="#756c67" font-weight="400"><tspan x="40" dy="0">React 폼 → MemberController → MemberService → MyBatis UPDATE → DB</tspan></text><rect x="40" y="180" width="540" height="205" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="60" y="216" font-size="24" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">생략 / null / 빈 문자열</tspan></text><text x="60" y="258" font-size="21" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">변경 없음으로 처리</tspan><tspan x="60" dy="32.550000000000004">password를 SET 대상에서 제외</tspan><tspan x="60" dy="32.550000000000004">기존 DB 해시를 그대로 보존</tspan></text><rect x="620" y="180" width="540" height="205" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="640" y="216" font-size="24" fill="#3b124b" font-weight="600"><tspan x="640" dy="0">명시적인 새 값</tspan></text><text x="640" y="258" font-size="21" fill="#302b2a" font-weight="400"><tspan x="640" dy="0">형식 검사 → BCrypt encode 1회</tspan><tspan x="640" dy="32.550000000000004">유효한 변경만 UPDATE</tspan><tspan x="640" dy="32.550000000000004">공백만 있거나 형식이 잘못되면 400</tspan></text><rect x="40" y="428" width="1120" height="135" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="62" y="466" font-size="22" fill="#3b124b" font-weight="600"><tspan x="62" dy="0">MyBatis 동적 UPDATE</tspan></text><text x="62" y="506" font-size="21" fill="#302b2a" font-weight="400"><tspan x="62" dy="0">password != null and password != &#x27;&#x27; 일 때만 password 컬럼 SET</tspan></text><text x="62" y="542" font-size="20" fill="#302b2a" font-weight="400"><tspan x="62" dy="0">기존 해시를 입력값으로 읽어 다시 인코딩하지 않는다.</tspan></text><text x="40" y="599" font-size="19" fill="#3b124b" font-weight="400"><tspan x="40" dy="0">검증 기록: 미입력 encoder 미호출 · 명시 변경 1회 · 잘못된 입력 거부 · 기존 해시 보존</tspan></text><rect x="40" y="620" width="1120" height="112" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="60" y="653" font-size="18" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">팀 기반</tspan></text><text x="60" y="688" font-size="18" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">회원 수정 API · BCrypt · MyBatis</tspan></text><text x="590" y="653" font-size="18" fill="#3b124b" font-weight="600"><tspan x="590" dy="0">이후 개인 개선</tspan></text><text x="590" y="688" font-size="18" fill="#302b2a" font-weight="400"><tspan x="590" dy="0">입력 검증 · 변경 없음 정규화 · 동적 SET</tspan></text><text x="40" y="770" font-size="17" fill="#756c67" font-weight="400"><tspan x="40" dy="0">형식 검증·선택 수정의 근거이며, 현재 비밀번호 재입력이나 별도 MFA를 추가한 구현은 아니다.</tspan></text></g></svg>