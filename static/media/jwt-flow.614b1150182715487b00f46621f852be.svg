<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">JWT Role 처리와 요청 흐름</title><desc id="desc">팀의 Spring Security 인증 기반 위에 Role 변환과 오류 처리를 보완한 실제 코드 흐름</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3b124b"/></marker></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect width="1200" height="800" fill="#faf8f4"/><text x="40" y="43" font-size="16" fill="#756c67" font-weight="500"><tspan x="40" dy="0">PETMILY / BACKEND ENGINEERING</tspan></text><text x="40" y="97" font-size="34" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">01 · JWT Role 처리와 요청 흐름</tspan></text><text x="40" y="138" font-size="21" fill="#756c67" font-weight="400"><tspan x="40" dy="0">기존 인증 기반을 유지하고, 권한 표현과 오류 처리 경계를 보완</tspan></text><rect x="40" y="178" width="208" height="106" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="60" y="214" font-size="24" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">React / Axios</tspan></text><text x="60" y="256" font-size="21" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">API 요청</tspan></text><path d="M248 230 L264 230" stroke="#3b124b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="268" y="178" width="208" height="106" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="288" y="214" font-size="24" fill="#3b124b" font-weight="600"><tspan x="288" dy="0">Spring Security</tspan></text><text x="288" y="256" font-size="21" fill="#302b2a" font-weight="400"><tspan x="288" dy="0">JWTFilter</tspan></text><path d="M476 230 L492 230" stroke="#3b124b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="496" y="178" width="208" height="106" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="516" y="214" font-size="24" fill="#3b124b" font-weight="600"><tspan x="516" dy="0">Controller</tspan></text><text x="516" y="256" font-size="21" fill="#302b2a" font-weight="400"><tspan x="516" dy="0">Service</tspan></text><path d="M704 230 L720 230" stroke="#3b124b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="724" y="178" width="208" height="106" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="744" y="214" font-size="24" fill="#3b124b" font-weight="600"><tspan x="744" dy="0">MyBatis</tspan></text><text x="744" y="256" font-size="21" fill="#302b2a" font-weight="400"><tspan x="744" dy="0">Mapper</tspan></text><path d="M932 230 L948 230" stroke="#3b124b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="952" y="178" width="208" height="106" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="972" y="214" font-size="24" fill="#3b124b" font-weight="600"><tspan x="972" dy="0">MariaDB</tspan></text><text x="972" y="256" font-size="21" fill="#302b2a" font-weight="400"><tspan x="972" dy="0">조회·저장</tspan></text><rect x="40" y="326" width="540" height="225" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="60" y="362" font-size="24" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">Role 표기 정규화</tspan></text><text x="60" y="404" font-size="21" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">ROLE_ADMIN → ADMIN → ROLE_ADMIN</tspan><tspan x="60" dy="32.550000000000004">접두사 제거 → Role Enum → GrantedAuthority</tspan><tspan x="60" dy="32.550000000000004">알 수 없는 Role은 USER로 제한</tspan></text><rect x="620" y="326" width="540" height="225" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="640" y="362" font-size="24" fill="#3b124b" font-weight="600"><tspan x="640" dy="0">인증 정보와 권한의 경계</tspan></text><text x="640" y="404" font-size="21" fill="#302b2a" font-weight="400"><tspan x="640" dy="0">서명·만료·access category 검증</tspan><tspan x="640" dy="32.550000000000004">파싱·필수 claim 오류 → 401</tspan><tspan x="640" dy="32.550000000000004">권한 부족은 인가 단계에서 403</tspan></text><text x="40" y="592" font-size="19" fill="#3b124b" font-weight="400"><tspan x="40" dy="0">검증 기록: ADMIN / ROLE_ADMIN 인가 동일 · 만료/잘못된 category/Refresh의 Access 사용은 401</tspan></text><rect x="40" y="620" width="1120" height="112" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="60" y="653" font-size="18" fill="#3b124b" font-weight="600"><tspan x="60" dy="0">팀 기반</tspan></text><text x="60" y="688" font-size="18" fill="#302b2a" font-weight="400"><tspan x="60" dy="0">로그인 필터 · AuthenticationManager · JWT 발급</tspan></text><text x="590" y="653" font-size="18" fill="#3b124b" font-weight="600"><tspan x="590" dy="0">이후 개인 개선</tspan></text><text x="590" y="688" font-size="18" fill="#302b2a" font-weight="400"><tspan x="590" dy="0">Role 변환 · category/claim 오류 처리 보완</tspan></text><text x="40" y="770" font-size="17" fill="#756c67" font-weight="400"><tspan x="40" dy="0">근거: JWTFilter · CustomUserDetails · AdminMemberApiTest / 흐름은 인증 체인 적용 요청 기준</tspan></text></g></svg>