<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1120" role="img" aria-labelledby="title desc"><title id="title">관리자 인가와 최신 DB 권한 모바일</title><desc id="desc">JWT와 현재 DB 권한을 모두 확인</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3b124b"/></marker></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect width="400" height="1120" fill="#faf8f4"/><text x="24" y="34" font-size="12" fill="#756c67" font-weight="500"><tspan x="24" dy="0">PETMILY / BACKEND</tspan></text><text x="24" y="76" font-size="25" fill="#3b124b" font-weight="600"><tspan x="24" dy="0">관리자 인가와 최신 DB 권한</tspan></text><text x="24" y="112" font-size="17" fill="#756c67" font-weight="400"><tspan x="24" dy="0">JWT와 현재 DB 권한을 모두 확인</tspan></text><rect x="24" y="148" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="180" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">1차 · 관리자 보안 체인</tspan></text><text x="40" y="215" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">JWT의 ROLE_ADMIN 확인</tspan><tspan x="40" dy="27.900000000000002">관리자 API에 우선 체인 적용</tspan></text><rect x="24" y="332" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="364" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">2차 · 현재 계정 조회</tspan></text><text x="40" y="399" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">MemberAccessService에서 검사</tspan><tspan x="40" dy="27.900000000000002">현재 DB Role도 ADMIN이어야 허용</tspan></text><rect x="24" y="516" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="548" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">권한 조합별 동작</tspan></text><text x="40" y="583" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">토큰 ADMIN + DB ADMIN → 허용</tspan><tspan x="40" dy="27.900000000000002">토큰 ADMIN + DB USER → 403</tspan><tspan x="40" dy="27.900000000000002">토큰 USER + DB ADMIN → 403</tspan></text><rect x="24" y="700" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="732" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">검증 기록</tspan></text><text x="40" y="767" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">관리자 강등 후 구 토큰 거부</tspan><tspan x="40" dy="27.900000000000002">삭제 계정은 인증 실패</tspan><tspan x="40" dy="27.900000000000002">서비스 직접 호출도 권한 검사</tspan></text><rect x="24" y="902" width="352" height="94" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="40" y="935" font-size="17" fill="#3b124b" font-weight="500"><tspan x="40" dy="0">팀: JWT·Spring Security 기반</tspan><tspan x="40" dy="26.35">개인: 관리자 체인·DB Role 검사</tspan></text><text x="24" y="1030" font-size="15" fill="#756c67" font-weight="400"><tspan x="24" dy="0">근거: MemberAccessService</tspan><tspan x="24" dy="23.25">MemberSecurityUnitTest</tspan><tspan x="24" dy="23.25">모든 API의 토큰 폐기 목록은 아님</tspan></text></g></svg>