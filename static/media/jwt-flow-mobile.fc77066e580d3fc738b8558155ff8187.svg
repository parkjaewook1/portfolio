<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1120" role="img" aria-labelledby="title desc"><title id="title">JWT Role 처리와 요청 흐름 모바일</title><desc id="desc">기존 인증 기반 위의 후속 개인 개선</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3b124b"/></marker></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect width="400" height="1120" fill="#faf8f4"/><text x="24" y="34" font-size="12" fill="#756c67" font-weight="500"><tspan x="24" dy="0">PETMILY / BACKEND</tspan></text><text x="24" y="76" font-size="25" fill="#3b124b" font-weight="600"><tspan x="24" dy="0">JWT Role 처리와 요청 흐름</tspan></text><text x="24" y="112" font-size="17" fill="#756c67" font-weight="400"><tspan x="24" dy="0">기존 인증 기반 위의 후속 개인 개선</tspan></text><rect x="24" y="148" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="180" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">요청 흐름</tspan></text><text x="40" y="215" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">React / Axios → Spring Security</tspan><tspan x="40" dy="27.900000000000002">JWTFilter → Controller / Service</tspan><tspan x="40" dy="27.900000000000002">MyBatis Mapper → MariaDB</tspan></text><rect x="24" y="332" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="364" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">Role 표기 정규화</tspan></text><text x="40" y="399" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">ROLE_ADMIN → ADMIN</tspan><tspan x="40" dy="27.900000000000002">Role Enum → ROLE_ADMIN 권한</tspan><tspan x="40" dy="27.900000000000002">알 수 없는 Role은 USER로 제한</tspan></text><rect x="24" y="516" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="548" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">인증 실패 처리</tspan></text><text x="40" y="583" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">서명·만료·access category 검사</tspan><tspan x="40" dy="27.900000000000002">파싱·필수 claim 오류는 401</tspan><tspan x="40" dy="27.900000000000002">권한 부족은 인가에서 403</tspan></text><rect x="24" y="700" width="352" height="166" rx="4" fill="#faf8f4" stroke="#dfd9d0"/><text x="40" y="732" font-size="21" fill="#3b124b" font-weight="600"><tspan x="40" dy="0">검증 기록</tspan></text><text x="40" y="767" font-size="18" fill="#302b2a" font-weight="400"><tspan x="40" dy="0">ADMIN / ROLE_ADMIN 인가 동일</tspan><tspan x="40" dy="27.900000000000002">만료·잘못된 category는 401</tspan><tspan x="40" dy="27.900000000000002">Refresh의 Access 사용도 401</tspan></text><rect x="24" y="902" width="352" height="94" rx="4" fill="#f0ece3" stroke="#dfd9d0"/><text x="40" y="935" font-size="17" fill="#3b124b" font-weight="500"><tspan x="40" dy="0">팀: 로그인 필터·JWT·인증 기반</tspan><tspan x="40" dy="26.35">개인: Role 변환·오류 처리 보완</tspan></text><text x="24" y="1030" font-size="15" fill="#756c67" font-weight="400"><tspan x="24" dy="0">근거: JWTFilter / CustomUserDetails</tspan><tspan x="24" dy="23.25">AdminMemberApiTest</tspan><tspan x="24" dy="23.25">인증 체인 적용 요청 기준</tspan></text></g></svg>